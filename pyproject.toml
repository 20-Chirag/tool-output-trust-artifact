[project]
name = "tool-output-trust-calibration"
version = "0.1.0"
description = "Benchmark and calibration harness for LLM agent trust decisions at the tool-output boundary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
